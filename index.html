<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <noscript>
      <meta content="0;url=?noscript" http-equiv="refresh">
    </noscript>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <script>try { var mode = localStorage.getItem('strata-theme') || localStorage.getItem('strata-default-theme') || '__DEFAULT_THEME__'; if (mode === 'system') mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; if (mode === 'light') document.documentElement.classList.add('light'); var css = localStorage.getItem('strata-appearance'); if (css) { var style = document.createElement('style'); style.id = 'strata-appearance'; style.textContent = css; document.head.appendChild(style) } } catch (e) { }</script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
